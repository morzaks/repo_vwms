 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VWMS - Visitor Request Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Visitor Request Form</h1>
            <p class="text-slate-500 text-sm mt-1">Shipper Warehouse Management</p>
        </div>

        <form id="visitorForm" class="space-y-5">
            <!-- Nama & Email -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="Name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email (Untuk Barcode)</label>
                    <input type="email" id="Email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- ID & Kategori -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">No. Identitas (KTP/SIM)</label>
                    <input type="text" id="ID_Number" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kategori Visitor</label>
                    <select id="Category" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="">Pilih Kategori...</option>
                        <option value="Internal">Internal (Shipper)</option>
                        <option value="External">External (Client/Vendor)</option>
                    </select>
                </div>
            </div>

            <!-- Departemen & Perusahaan (Dinamis) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div id="deptContainer" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Departemen</label>
                    <input type="text" id="Department" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Perusahaan</label>
                    <input type="text" id="Company" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Jadwal & Warehouse -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jadwal Kedatangan</label>
                    <input type="date" id="Visit_Date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Lokasi Gudang</label>
                    <select id="Warehouse_Code" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="">Pilih Gudang...</option>
                        <option value="WH-JKT01">WH-JKT01 (Balaraja)</option>
                        <option value="WH-BDO01">WH-BDO01 (Bandung)</option>
                        <!-- Nanti ini bisa dibuat dinamis narik dari database, untuk sekarang kita hardcode dulu sbg dummy -->
                    </select>
                </div>
            </div>

            <!-- Tujuan -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tujuan Kedatangan</label>
                <textarea id="Visit_Purpose" required rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
                Submit Request
            </button>
            
            <!-- Notifikasi -->
            <div id="statusMessage" class="hidden text-center text-sm font-medium p-3 rounded-lg mt-3"></div>
        </form>
    </div>

    <!-- Panggil file logika JS -->
    <script src="app.js"></script>
</body>
</html>
