<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - VWMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    
    <nav class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">VWMS Manager Dashboard</h1>
        <div class="flex items-center gap-4">
            <span id="userEmailDisplay" class="text-sm bg-blue-800 px-3 py-1 rounded-full"></span>
            <button onclick="logout()" class="text-sm hover:text-red-300 font-semibold">Logout</button>
        </div>
    </nav>

    <main class="p-6 max-w-6xl mx-auto">
        <h2 class="text-2xl font-semibold text-slate-800 mb-6">Dashboard Summary</h2>
        
        <!-- Filter Tanggal & Export -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mulai Tanggal Kunjungan</label>
                <input type="date" id="filterStartDate" class="border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Sampai Tanggal</label>
                <input type="date" id="filterEndDate" class="border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="applyFilter()" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 font-semibold transition shadow">Filter</button>
            <button onclick="resetFilter()" class="bg-slate-200 text-slate-700 px-5 py-2 rounded-lg hover:bg-slate-300 font-semibold transition">Reset</button>
            
            <!-- Tombol Export Baru -->
            <button onclick="exportToCSV()" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 font-semibold transition shadow ml-auto flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Export CSV
            </button>

            <!-- Tombol Add Account (BARU) -->
            <button onclick="openAccountModal()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 font-semibold transition shadow ml-2 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z" />
                </svg>
                Add Account
            </button>
        </div>

        <!-- Summary Cards (Dibuat otomatis oleh JS) -->
        <div id="summaryCards" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow text-center text-slate-500 col-span-full">Memuat summary...</div>
        </div>
        
        <h2 class="text-2xl font-semibold text-slate-800 mb-4">Visitor Requests List</h2>
        <!-- Tabel List Request -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b">
                        <th class="p-4 font-semibold text-slate-600">ID</th>
                        <th class="p-4 font-semibold text-slate-600">Nama</th>
                        <th class="p-4 font-semibold text-slate-600">Perusahaan</th>
                        <th class="p-4 font-semibold text-slate-600">Jadwal</th>
                        <th class="p-4 font-semibold text-slate-600">Gudang</th>
                        <th class="p-4 font-semibold text-slate-600 text-center">Status</th>
                        <th class="p-4 font-semibold text-slate-600 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-100">
                    <tr><td colspan="7" class="p-4 text-center text-slate-500">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="dashboard.js"></script>

    <!-- MODAL ADD ACCOUNT -->
    <div id="accountModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-xl text-slate-800">Tambah Akun Baru</h3>
                <button onclick="closeAccountModal()" class="text-slate-400 hover:text-slate-600 font-bold text-2xl leading-none">&times;</button>
            </div>
            <form id="addAccountForm" class="space-y-4" onsubmit="submitNewAccount(event)">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Role Akses</label>
                    <select id="accRole" required onchange="toggleAccountFields()" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="Manager">Manager (Spesifik Gudang)</option>
                        <option value="Manager_All">Manager All (Semua Gudang)</option>
                        <option value="Security">Security (Spesifik Gudang)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                    <input type="text" id="accUsername" required placeholder="email@shipper.id atau SEC-WH01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <!-- Hanya muncul jika Role = Security -->
                <div id="passwordField" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password (Untuk Security)</label>
                    <input type="password" id="accPassword" placeholder="Masukkan password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <!-- Hilang jika Role = Manager_All -->
                <div id="warehouseField">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kode Gudang</label>
                    <input type="text" id="accWarehouse" placeholder="Contoh: WH-CGK60" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" id="submitAccBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-200 mt-4 shadow">Simpan Akun</button>
            </form>
        </div>
    </div>

</body>
</html>
